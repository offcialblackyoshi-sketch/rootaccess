<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Root Access preview encoder</title>
<!-- Used by tools/video/record.mjs: builds the preview as an MP4, frame by
     frame at exactly 30 frames a second (the cover first, then the recorded
     gameplay at its real timing). Uses Chrome's H.264 encoder (WebCodecs)
     and the small mp4-muxer library to write a standard MP4 file. -->
<style>html, body { margin: 0; background: #000; } canvas { display: block; }</style>
</head>
<body>
<canvas id="c"></canvas>
<script type="module">
  import { Muxer, ArrayBufferTarget } from 'https://cdn.jsdelivr.net/npm/mp4-muxer@5.1.3/+esm';

  const layout = new URLSearchParams(location.search).get('layout') === 'portrait' ? 'portrait' : 'landscape';
  const SIZE = { landscape: [1920, 1080], portrait: [1080, 1620] }[layout];
  const COVER = { landscape: '../../dist/covers/root-access-landscape-1920x1080.png', portrait: '../../dist/covers/root-access-portrait-800x1200.png' }[layout];
  const FPS = 30;
  const MAX_MS = 19800; // CrazyGames cuts videos at 20 s
  const canvas = document.getElementById('c');
  [canvas.width, canvas.height] = SIZE;
  const g = canvas.getContext('2d');
  // Load an image, retrying a few times (the little test server can drop requests).
  const loadOnce = (src) => new Promise((ok, fail) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => fail(new Error('missing ' + src)); i.src = src; });
  const load = async (src) => { for (let n = 0; ; n++) { try { return await loadOnce(src + (n ? '?retry=' + n : '')); } catch (e) { if (n >= 4) throw e; await new Promise((r) => setTimeout(r, 300)); } } };

  window.__encode = async () => {
    const { timeline } = await (await fetch('../../dist/video/frames/timeline.json')).json();
    const cover = await load(COVER);
    const frames = await Promise.all(timeline.map((f) => load('../../dist/video/frames/' + f.file)));
    const gameMs = timeline.reduce((s, f) => s + f.ms, 0);
    const coverMs = Math.max(1200, Math.min(2000, MAX_MS - gameMs)); // the cover opens the video
    const total = Math.min(MAX_MS, coverMs + gameMs);
    window.__info = { w: SIZE[0], h: SIZE[1], ms: total };
    console.log(`${layout}: ${frames.length} frames loaded, cover ${coverMs} ms + gameplay ${gameMs} ms`);

    // Portrait: the gameplay sits on the dimmed portrait cover art (no black bars).
    function drawGame(img) {
      const [w, h] = SIZE;
      if (layout === 'landscape') { g.drawImage(img, 0, 0, w, h); return; }
      g.save();
      g.filter = 'blur(6px) brightness(0.45)';
      g.drawImage(cover, -20, -20, w + 40, h + 40);
      g.restore();
      // Crop to the game area (left of the side panels) so text stays readable on a phone.
      const sx = 30, sw = 1420, sh = 1080;
      const gh = Math.round((w * sh) / sw);
      const y = Math.round((h - gh) / 2) - 90;
      g.save();
      g.shadowColor = 'rgba(57, 255, 106, 0.55)';
      g.shadowBlur = 40;
      g.drawImage(img, sx, 0, sw, sh, 0, y, w, gh);
      g.restore();
    }
    // Which recorded frame is on screen at time t (ms after the cover).
    const starts = [];
    timeline.reduce((acc, f, i) => { starts[i] = acc; return acc + f.ms; }, 0);
    const frameAt = (t) => { let lo = 0, hi = starts.length - 1; while (lo < hi) { const mid = (lo + hi + 1) >> 1; if (starts[mid] <= t) lo = mid; else hi = mid - 1; } return frames[lo]; };
    const draw = (t) => { if (t < coverMs) g.drawImage(cover, 0, 0, SIZE[0], SIZE[1]); else drawGame(frameAt(t - coverMs)); };
    window.__peek = (t) => { draw(t); return canvas.toDataURL('image/jpeg', 0.7); }; // for checking

    // Encode every frame with an exact timestamp: the timing never depends on how fast this runs.
    const muxer = new Muxer({ target: new ArrayBufferTarget(), video: { codec: 'avc', width: SIZE[0], height: SIZE[1], frameRate: FPS }, fastStart: 'in-memory' });
    let failed = null;
    const encoder = new VideoEncoder({ output: (chunk, meta) => muxer.addVideoChunk(chunk, meta), error: (e) => { failed = e; } });
    encoder.configure({ codec: 'avc1.640028', width: SIZE[0], height: SIZE[1], bitrate: 8_000_000, framerate: FPS });
    const count = Math.round((total / 1000) * FPS);
    for (let i = 0; i < count; i++) {
      draw((i * 1000) / FPS);
      const frame = new VideoFrame(canvas, { timestamp: Math.round((i * 1e6) / FPS), duration: Math.round(1e6 / FPS) });
      encoder.encode(frame, { keyFrame: i % (FPS * 2) === 0 });
      frame.close();
      if (encoder.encodeQueueSize > 8) await new Promise((r) => setTimeout(r, 5)); // don't run ahead of the encoder
      if (failed) throw failed;
    }
    await encoder.flush();
    muxer.finalize();
    const buf = new Uint8Array(muxer.target.buffer);
    console.log(`${layout}: ${count} frames encoded, ${(buf.length / 1048576).toFixed(1)} MB`);
    let bin = '';
    for (let i = 0; i < buf.length; i += 0x8000) bin += String.fromCharCode(...buf.subarray(i, i + 0x8000));
    window.__b64 = btoa(bin); // read back in pieces (one huge message stalls)
    return window.__b64.length;
  };
</script>
</body>
</html>
